name: RAD masked archive audit (metadata only)

on:
  push:
    branches:
      - rad-data-audit-20261010
    paths:
      - '.github/workflows/rad-data-audit.yml'
      - 'tools/rad_data_audit/rad_audit.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit dependencies
        run: python -m pip install -r tools/rad_data_audit/requirements.txt
      - name: Download official masked archive in temporary directory
        run: |
          mkdir -p "$RUNNER_TEMP/rad_data"
          python tools/rad_data_audit/rad_audit.py download --root "$RUNNER_TEMP/rad_data"
      - name: Inspect true archive ground-truth structure
        run: |
          python - <<'PY'
          import os,zipfile,collections
          p=os.path.join(os.environ["RUNNER_TEMP"],"rad_data","Anomaly_refine_msk.zip")
          with zipfile.ZipFile(p) as z:
              files=[x.filename for x in z.infolist() if not x.is_dir()]
              gt=[x for x in files if "ground_truth" in x.lower() or "mask" in x.lower()]
              print("ZIP_TOTAL_FILES",len(files),"GT_OR_MASK_PATH_COUNT",len(gt))
              print("GT_OR_MASK_PATH_SAMPLES",gt[:25])
              print("LAST_ENTRIES",files[-25:])
              print("PATH_PREFIX_COUNTER",collections.Counter("/".join(x.split("/")[:3]) for x in files).most_common(25))
          PY
      - name: Audit real image and mask files; no model inference
        run: |
          mkdir -p rad_audit_output
          python tools/rad_data_audit/rad_audit.py audit \
            --archive "$RUNNER_TEMP/rad_data/Anomaly_refine_msk.zip" \
            --out rad_audit_output \
            --draws 5 | tee rad_audit_output/AUDIT_RUN_LOG.txt
          python -c 'import json; d=json.load(open("rad_audit_output/RAD_FILE_AUDIT.json")); print("REAL_ARCHIVE_COUNTS",d["images"],d["categories"],d["instances"],d["normal"],d["anomaly"],d["mask_status"])'
      - name: Upload derived audit metadata only, never images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rad-file-audit-metadata
          path: rad_audit_output/
          if-no-files-found: warn
          retention-days: 7
